<!-- user_registration_bootstrap.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register — OnlineCourse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:480px;">
  <div class="card shadow">
    <div class="card-header bg-success text-white text-center fw-bold fs-5">Register</div>
    <div class="card-body">
      {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
      <form method="post" action="{% url 'onlinecourse:registration' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">First Name</label>
          <input type="text" name="firstname" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" name="lastname" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="psw" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
      <p class="mt-3 text-center">Have an account? <a href="{% url 'onlinecourse:login' %}">Login</a></p>
    </div>
  </div>
</div>
</body>
</html>
