<!-- user_login_bootstrap.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — OnlineCourse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:420px;">
  <div class="card shadow">
    <div class="card-header bg-dark text-white text-center fw-bold fs-5">Login</div>
    <div class="card-body">
      {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
      <form method="post" action="{% url 'onlinecourse:login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="psw" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="mt-3 text-center">No account? <a href="{% url 'onlinecourse:registration' %}">Register</a></p>
    </div>
  </div>
</div>
</body>
</html>
